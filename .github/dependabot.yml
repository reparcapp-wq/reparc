version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      production-patches:
        dependency-type: production
        update-types: ["patch"]
      development-patches:
        dependency-type: development
        update-types: ["patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

